name: Numerical Portfolio QA

on:
  push:
    paths:
      - "portfolio/advanced-demos/**"
      - ".github/workflows/numerical-portfolio-qa.yml"
  pull_request:
    paths:
      - "portfolio/advanced-demos/**"
      - ".github/workflows/numerical-portfolio-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-tested-examples:
    name: Python ${{ matrix.python-version }} / Synthetic numerical demos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: portfolio/advanced-demos/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r portfolio/advanced-demos/requirements.txt
      - name: Nine-channel FDD - synthetic verification
        run: python portfolio/advanced-demos/nine_channel_fdd_demo.py
      - name: Robust LQR - 27-case verification
        run: python portfolio/advanced-demos/lqr_vibration_robustness_demo.py
      - name: Two-DOF TMD - robust absorber optimization
        run: python portfolio/advanced-demos/robust_2dof_tmd_demo.py

      - name: Synthetic online congestion-game route-choice unit tests
        run: python -m unittest discover -s portfolio/advanced-demos/online_congestion_game -p 'test_synthetic_online_congestion_game_demo.py' -v
      - name: Synthetic OpenSees-style recorder plot unit tests
        run: python -m unittest discover -s portfolio/advanced-demos/opensees_recorder_plotting -p 'test_opensees_recorder_plot_demo.py' -v

  
  opencv-synthetic-inspection:
    name: Python ${{ matrix.python-version }} / Synthetic OpenCV inspection
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated OpenCV demo dependencies
        run: python -m pip install "numpy>=1.24,<3" "opencv-python-headless>=4.10,<5" "pytest>=8,<9"
      - name: Run synthetic OpenCV unit tests
        run: python -m pytest -q portfolio/advanced-demos/opencv_inspection/test_synthetic_opencv_inspection_demo.py
      - name: Generate and reconcile demo artifacts
        run: |
          python portfolio/advanced-demos/opencv_inspection/synthetic_opencv_inspection_demo.py --output "$RUNNER_TEMP/opencv-demo-output"
          python -c "import json, pathlib; p=pathlib.Path('$RUNNER_TEMP/opencv-demo-output/summary.json'); s=json.loads(p.read_text()); assert s['detected_count']==4 and s['class_count_match']; print(s['detected_by_class'])"
