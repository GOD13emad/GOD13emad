name: Profile artwork integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout the source snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Exercise positive and fail-closed README fixtures
        run: python3 tools/verify_profile_artwork.py --self-test
      - name: Verify exact approved image and README reference
        run: >-
          python3 tools/verify_profile_artwork.py
          --image assets/profile-header-approved-20261030.webp
          --blob-sha 60937bcf7f3d4e9a78c535c1f842a707c2f0a6d0
          --retired-path assets/profile-header.svg
